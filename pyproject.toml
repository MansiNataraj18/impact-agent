[project]
name = "impact-agent"
version = "0.1.0"
description = "Impact Agent built on the Aetherion SDK"
requires-python = ">=3.12.10,<3.14"
dependencies = [
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.55-cp312-cp312-macosx_15_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fastapi>=0.120",
    "uvicorn>=0.35",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
